name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Recreate Android Project & Build
        run: |
          rm -rf android
          flutter create --org com.bhaijeeshan.dnd --project-name dnd_app --platforms android .
          
          # Force set compatible Kotlin version in settings.gradle/build.gradle
          sed -i 's/1.7.1/1.8.22/g' android/build.gradle 2>/dev/null || true
          sed -i 's/1.9.0/1.8.22/g' android/build.gradle 2>/dev/null || true
          
          flutter pub get
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dnd-geofence-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
