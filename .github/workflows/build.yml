name: Build APK

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Clean & Re-create Android Project
      run: |
        rm -rf android
        flutter create . --platforms=android --org com.example --project-name dnd_app

    - name: Set App Title & Location Permissions
      run: |
        python3 -c '
        path = "android/app/src/main/AndroidManifest.xml"
        with open(path, "r") as f:
            content = f.read()
        
        # Add Location Permissions
        perms = """    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION"/>\n"""
        content = content.replace("<application", perms + "    <application")
        
        # Set App Display Name
        content = content.replace("android:label=\"dnd_app\"", "android:label=\"Masjid Auto Silent\"")
        
        with open(path, "w") as f:
            f.write(content)
        '

    - name: Generate Launcher Icons
      run: |
        flutter pub get
        dart run flutter_launcher_icons

    - name: Build Debug APK
      run: |
        flutter build apk --debug --no-tree-shake-icons

    - name: Create Github Release
      uses: softprops/action-gh-release@v1
      with:
        files: build/app/outputs/flutter-apk/app-debug.apk
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
