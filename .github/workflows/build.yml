name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Build Debug APK
      run: |
        flutter create . --platforms=android --org com.example

        # Fix styles.xml to avoid v1 embedding issue
        mkdir -p android/app/src/main/res/values
        cat <<EOF > android/app/src/main/res/values/styles.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="LaunchTheme" parent="Theme.AppCompat.Light.NoActionBar">
                <item name="android:windowBackground">@drawable/launch_background</item>
            </style>
            <style name="NormalTheme" parent="Theme.AppCompat.Light.NoActionBar">
                <item name="android:windowBackground">?android:attr/colorBackground</item>
            </style>
        </resources>
        EOF

        # Inject permissions into AndroidManifest.xml
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        cat <<EOF > $MANIFEST
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
            <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
            <uses-permission android:name="android.permission.ACCESS_NOTIFICATION_POLICY" />
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />

            <application
                android:label="Masjid Auto Silent"
                android:name="\${applicationName}"
                android:icon="@mipmap/ic_launcher">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:launchMode="singleTop"
                    android:theme="@style/LaunchTheme"
                    android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                    android:hardwareAccelerated="true"
                    android:windowSoftInputMode="adjustResize">
                    <meta-data
                      android:name="io.flutter.embedding.android.NormalTheme"
                      android:resource="@style/NormalTheme" />
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN"/>
                        <category android:name="android.intent.category.LAUNCHER"/>
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        flutter pub get
        flutter build apk --debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MasjidApp
        path: build/app/outputs/flutter-apk/app-debug.apk
